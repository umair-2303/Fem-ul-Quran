<!DOCTYPE html>
<html lang="ur" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fehm-e-Quran II Final Term Quiz Bank</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: '#0F172A',
            teal: '#14B8A6',
            offwhite: '#F8FAFC',
            amber: '#F59E0B',
            violet: '#8B5CF6'
          },
          fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
            urdu: ['Noto Nastaliq Urdu', 'serif']
          }
        }
      }
    }
  </script>
  <style>
    .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .light .glass {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body class="bg-slate-900 text-offwhite font-poppins min-h-screen transition-colors duration-300 light:bg-offwhite light:text-slate-900">

  <!-- Top Navbar -->
  <header class="sticky top-0 z-50 glass border-b border-slate-700/50 px-4 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3 space-x-reverse">
        <div class="w-10 h-10 rounded-xl bg-teal flex items-center justify-center font-bold text-navy text-xl shadow-lg shadow-teal/20">📖</div>
        <div>
          <h1 class="font-bold text-lg leading-tight">فہم قرآن 2 - Final Term</h1>
          <p class="text-xs text-slate-400">MCQs Database & Quiz Engine</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="bg-slate-800/80 px-3 py-1.5 rounded-lg text-sm border border-slate-700/50 flex items-center gap-2">
          <span>⏱️</span>
          <span id="timer-display" class="font-mono font-semibold text-amber">00:00</span>
        </div>
        <button id="theme-toggle" onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber transition">
          🌙
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

    <!-- Sidebar Controls -->
    <aside class="lg:col-span-1 space-y-4">
      <div class="glass p-5 rounded-2xl space-y-4">
        <h2 class="font-bold text-teal flex items-center gap-2">⚙️ Quiz Controls</h2>
        
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-400">Select Mode</label>
          <select id="quiz-mode" onchange="changeMode()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-teal outline-none">
            <option value="practice">Practice Mode (Instant Feedback)</option>
            <option value="exam">Exam Mode (Timed / Final Score)</option>
            <option value="sequential">Sequential Learning Mode</option>
            <option value="random">Random Question Stream</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-400">Quick Test Selector</label>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="startQuickQuiz(10)" class="bg-slate-800 hover:bg-teal hover:text-navy p-2 rounded-lg text-xs font-semibold border border-slate-700 transition">10 MCQs</button>
            <button onclick="startQuickQuiz(20)" class="bg-slate-800 hover:bg-teal hover:text-navy p-2 rounded-lg text-xs font-semibold border border-slate-700 transition">20 MCQs</button>
            <button onclick="startQuickQuiz(50)" class="bg-slate-800 hover:bg-teal hover:text-navy p-2 rounded-lg text-xs font-semibold border border-slate-700 transition">50 MCQs</button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-400">Jump To Question</label>
          <select id="question-dropdown" onchange="jumpToQuestion(this.value)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-teal outline-none max-h-40">
          </select>
        </div>

        <div class="space-y-2 pt-2 border-t border-slate-700/50">
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" id="shuffle-options" onchange="renderQuestion()" class="accent-teal rounded">
            <span>Shuffle Options (A–D)</span>
          </label>
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" id="filter-bookmarks" onchange="toggleBookmarkFilter()" class="accent-amber rounded">
            <span>Show Bookmarked Only (<span id="bookmark-count">0</span>)</span>
          </label>
        </div>

        <button onclick="shuffleCurrentSet()" class="w-full bg-violet/20 hover:bg-violet/30 text-violet border border-violet/40 p-2.5 rounded-xl font-medium text-sm transition">
          🔀 Shuffle Questions
        </button>
      </div>

      <!-- Dashboard Progress -->
      <div class="glass p-5 rounded-2xl space-y-3">
        <h2 class="font-bold text-amber flex items-center gap-2">📊 Score Tracker</h2>
        <div class="grid grid-cols-2 gap-3 text-center">
          <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
            <div class="text-xs text-slate-400">Attempted</div>
            <div id="stat-attempted" class="text-xl font-bold text-teal">0</div>
          </div>
          <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
            <div class="text-xs text-slate-400">Score</div>
            <div id="stat-score" class="text-xl font-bold text-amber">0%</div>
          </div>
        </div>
        <button onclick="reviewWrongAnswers()" class="w-full bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 p-2 rounded-lg text-xs font-semibold transition">
          ⚠️ Review Wrong Answers (<span id="wrong-count">0</span>)
        </button>
      </div>
    </aside>

    <!-- Main Quiz Workspace -->
    <section class="lg:col-span-3 space-y-6">
      
      <!-- Progress Bar -->
      <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden border border-slate-700">
        <div id="progress-bar" class="bg-gradient-to-r from-teal via-violet to-amber h-full transition-all duration-300" style="width: 0%"></div>
      </div>

      <!-- Question Card -->
      <div class="glass p-6 md:p-8 rounded-3xl relative shadow-2xl min-h-[380px] flex flex-col justify-between">
        
        <div>
          <div class="flex justify-between items-center mb-6">
            <span id="question-tag" class="px-3 py-1 rounded-full text-xs font-semibold bg-teal/20 text-teal border border-teal/30">
              Question 1
            </span>
            <button id="bookmark-btn" onclick="toggleBookmark()" class="text-2xl hover:scale-110 transition">
              🔖
            </button>
          </div>

          <!-- Urdu Question Text -->
          <div id="question-text" class="font-urdu text-xl md:text-2xl leading-loose mb-8 text-right font-medium">
            Loading question...
          </div>

          <!-- Options Grid -->
          <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Dynamic Options -->
          </div>
        </div>

        <!-- Explanation Block -->
        <div id="explanation-box" class="hidden mt-6 p-4 rounded-xl bg-slate-800/80 border border-slate-700 text-sm space-y-1">
          <span class="font-bold text-amber">💡 Explanation / Reference:</span>
          <p id="explanation-text" class="font-urdu text-slate-300 leading-relaxed"></p>
        </div>

        <!-- Card Footer Navigation -->
        <div class="flex flex-wrap items-center justify-between gap-4 mt-8 pt-6 border-t border-slate-700/50">
          <button id="show-answer-btn" onclick="toggleAnswer()" class="bg-slate-800 hover:bg-slate-700 text-xs md:text-sm px-4 py-2.5 rounded-xl border border-slate-700 font-semibold transition">
            👁️ Show Answer
          </button>

          <div class="flex gap-3">
            <button onclick="navigateQuestion(-1)" class="bg-slate-800 hover:bg-teal hover:text-navy px-5 py-2.5 rounded-xl font-semibold text-sm border border-slate-700 transition">
              Previous
            </button>
            <button onclick="navigateQuestion(1)" class="bg-teal hover:bg-teal/80 text-navy px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-teal/20 transition">
              Next
            </button>
          </div>
        </div>
      </div>

      <!-- Keyboard Shortcut Helper Bar -->
      <div class="text-xs text-slate-500 flex flex-wrap gap-4 justify-center pt-2">
        <span>⌨️ Shortcuts:</span>
        <span><kbd class="bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">←</kbd> Next</span>
        <span><kbd class="bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">→</kbd> Prev</span>
        <span><kbd class="bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">1-4</kbd> Options</span>
        <span><kbd class="bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">Space</kbd> Toggle Answer</span>
      </div>
    </section>
  </main>

    // State Variables
    let currentQuestions = [...rawData];
    let currentIndex = 0;
    let userAnswers = {};
    let bookmarks = JSON.parse(localStorage.getItem('fehm_bookmarks') || '[]');
    let wrongAnswers = JSON.parse(localStorage.getItem('fehm_wrongs') || '[]');
    let quizMode = 'practice';

    let timerInterval = null;
    let secondsElapsed = 0;

    // Elements
    const qText = document.getElementById('question-text');

    const optionsGrid = document.getElementById('options-container');
    const explanationBox = document.getElementById('explanation-box');

    const bCount = document.getElementById('bookmark-count');
    const wCount = document.getElementById('wrong-count');
    const pBar = document.getElementById('progress-bar');

    // Initialize App
    function init() {
      populateDropdown();
      updateBookmarksUI();
      updateStats();
      startTimer();
      renderQuestion();

      // Keyboard listener
      document.addEventListener('keydown', handleKeyPress);
    }

    function populateDropdown() {
      dropdown.innerHTML = '';
      currentQuestions.forEach((q, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `Q${q.id}: ${q.question.substring(0, 30)}...`;
        dropdown.appendChild(opt);
      });
    }

    function startTimer() {
      clearInterval(timerInterval);
      secondsElapsed = 0;
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer-display').textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function renderQuestion() {
      if (currentQuestions.length === 0) {
        qText.textContent = "کوئی سوالات دستیاب نہیں ہیں۔";
        optionsGrid.innerHTML = '';
        return;
      }

      const q = currentQuestions[currentIndex];
      qTag.textContent = `سوال ${currentIndex + 1} / ${currentQuestions.length}`;
      qText.textContent = q.question;
      dropdown.value = currentIndex;

      // Update Bookmark Icon
      const isBookmarked = bookmarks.includes(q.id);
      document.getElementById('bookmark-btn').textContent = isBookmarked ? '🔖' : '🏷️';

      // Hide Answer & Explanation by default
      explanationBox.classList.add('hidden');

      // Process options
      optionsGrid.innerHTML = '';
      let opts = q.options.map((opt, index) => ({ text: opt, originalIndex: index }));

      if (document.getElementById('shuffle-options').checked) {
        opts = opts.sort(() => Math.random() - 0.5);
      }

      const labels = ['A', 'B', 'C', 'D'];

      opts.forEach((optObj, idx) => {
        const btn = document.createElement('button');
        btn.className = `w-full text-right p-4 rounded-xl border transition flex items-center justify-between font-urdu text-lg ${
          userAnswers[q.id] === optObj.originalIndex 
            ? 'bg-teal/20 border-teal text-teal font-bold' 
            : 'bg-slate-800/60 border-slate-700/80 hover:bg-slate-700/50'
        }`;

        // Feedback formatting for Practice Mode
        if (quizMode === 'practice' && userAnswers[q.id] !== undefined) {
          if (optObj.originalIndex === q.answer) {
            btn.className = 'w-full text-right p-4 rounded-xl border bg-emerald-500/20 border-emerald-500 text-emerald-300 font-bold flex items-center justify-between font-urdu text-lg';
          } else if (userAnswers[q.id] === optObj.originalIndex) {
            btn.className = 'w-full text-right p-4 rounded-xl border bg-red-500/20 border-red-500 text-red-300 flex items-center justify-between font-urdu text-lg';
          }
        }

        btn.onclick = () => selectOption(q.id, optObj.originalIndex);
        btn.innerHTML = `
          <span>${optObj.text}</span>
          <span class="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded font-poppins font-normal">${labels[idx]}</span>
        `;
        optionsGrid.appendChild(btn);
      });

      // Show explanation if answered in practice mode
      if (quizMode === 'practice' && userAnswers[q.id] !== undefined) {
        showExplanation();
      }

      // Update progress
      const progress = ((currentIndex + 1) / currentQuestions.length) * 100;
      pBar.style.width = `${progress}%`;
    }

    function selectOption(qId, optionIdx) {
      userAnswers[qId] = optionIdx;
      const q = rawData.find(item => item.id === qId);

      if (optionIdx !== q.answer) {
        if (!wrongAnswers.includes(qId)) wrongAnswers.push(qId);
      } else {
        wrongAnswers = wrongAnswers.filter(id => id !== qId);
      }

      localStorage.setItem('fehm_wrongs', JSON.stringify(wrongAnswers));
      updateStats();
      renderQuestion();
    }

    function toggleAnswer() {
      const q = currentQuestions[currentIndex];
      if (userAnswers[q.id] === undefined) {
        userAnswers[q.id] = q.answer;
        updateStats();
      }
      showExplanation();
      renderQuestion();
    }

    function showExplanation() {
      const q = currentQuestions[currentIndex];
      explanationText.textContent = `صحیح جواب: "${q.options[q.answer]}"۔`;
      explanationBox.classList.remove('hidden');
    }

    function navigateQuestion(direction) {
      if (currentIndex + direction >= 0 && currentIndex + direction < currentQuestions.length) {
        currentIndex += direction;
        renderQuestion();
      }
    }

    function jumpToQuestion(idx) {
      currentIndex = parseInt(idx);
      renderQuestion();
    }

    function toggleBookmark() {
      const q = currentQuestions[currentIndex];
      if (bookmarks.includes(q.id)) {
        bookmarks = bookmarks.filter(id => id !== q.id);
      } else {
        bookmarks.push(q.id);
      }
      localStorage.setItem('fehm_bookmarks', JSON.stringify(bookmarks));
      updateBookmarksUI();
      renderQuestion();
    }

    function updateBookmarksUI() {
      bCount.textContent = bookmarks.length;
    }

    function toggleBookmarkFilter() {
      filterBookmarkedOnly = document.getElementById('filter-bookmarks').checked;
      if (filterBookmarkedOnly) {
        currentQuestions = rawData.filter(q => bookmarks.includes(q.id));
      } else {
        currentQuestions = [...rawData];
      }
      currentIndex = 0;
      populateDropdown();
      renderQuestion();
    }

    function shuffleCurrentSet() {
      currentQuestions = currentQuestions.sort(() => Math.random() - 0.5);
      currentIndex = 0;
      populateDropdown();
      renderQuestion();
    }

    function startQuickQuiz(amount) {
      currentQuestions = [...rawData].sort(() => Math.random() - 0.5).slice(0, amount);
      currentIndex = 0;
      userAnswers = {};
      populateDropdown();
      updateStats();
      renderQuestion();
    }

    function reviewWrongAnswers() {
      if (wrongAnswers.length === 0) {
        alert("🎉 کوئی غلط جواب موجود نہیں ہے!");
        return;
      }
      currentQuestions = rawData.filter(q => wrongAnswers.includes(q.id));
      currentIndex = 0;
      populateDropdown();
      renderQuestion();
    }

    function updateStats() {
      const attempted = Object.keys(userAnswers).length;
      let correct = 0;

      Object.keys(userAnswers).forEach(qId => {
        const q = rawData.find(item => item.id == qId);
        if (q && userAnswers[qId] === q.answer) {
          correct++;
        }
      });

      const percentage = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
      document.getElementById('stat-attempted').textContent = attempted;
      document.getElementById('stat-score').textContent = `${percentage}%`;
      wCount.textContent = wrongAnswers.length;
    }

    function changeMode() {
      quizMode = document.getElementById('quiz-mode').value;
      if (quizMode === 'random') {
        shuffleCurrentSet();
      } else {
        renderQuestion();
      }
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      document.documentElement.classList.toggle('light');
    }

    function handleKeyPress(e) {
      if (e.key === 'ArrowRight') navigateQuestion(-1);
      if (e.key === 'ArrowLeft') navigateQuestion(1);
      if (e.key === ' ') { e.preventDefault(); toggleAnswer(); }
      if (['1', '2', '3', '4'].includes(e.key)) {
        const idx = parseInt(e.key) - 1;
        const q = currentQuestions[currentIndex];
        if (q && q.options[idx]) {
          selectOption(q.id, idx);
        }
      }
    }

    // Launch Engine
    init();
  </script>
</body>
</html>
